components:
  schemas:
    release-track-snapshot:
      type: object
      description: 'A snapshot document for a release track, containing versioned member objects and workflow tiers'
      properties:
        id:
          type: string
          description: 'The release track ID (STIX identifier format)'
          example: 'release-track--a1b2c3d4-e5f6-7890-abcd-ef1234567890'
        type:
          type: string
          enum:
            - standard
            - virtual
          description: 'Track type: standard (direct object management) or virtual (aggregation)'
        modified:
          type: string
          format: date-time
          description: 'When this snapshot was created'
        version:
          type: string
          nullable: true
          description: 'Semantic version (e.g., "1.0", "2.1") if tagged, null for draft snapshots'
          example: '1.0'
        graph_manifest_id:
          type: string
          readOnly: true
          description: |
            Server-controlled identifier for an opt-in deterministic member
            graph on a tagged snapshot. Absent on drafts and graphless tagged
            snapshots. Clients should treat this value as opaque.
        bundle_hashes:
          $ref: '#/components/schemas/bundle-hashes'
        snapshot_description:
          type: string
          maxLength: 4000
          description: |
            User-authored, snapshot-local notes. Editors may change this
            workspace annotation without changing the snapshot identity or
            release tag while no pinned member graph exists. Cached snapshots
            reject note edits until their graph is deleted and regenerated;
            graphless exports fall back to the track description when absent.
        name:
          type: string
          pattern: '^[a-zA-Z0-9 &]+$'
          description: 'Human-readable track name containing alphanumeric characters, spaces, and ampersands'
          example: 'Enterprise ATT&CK'
        description:
          type: string
          description: 'Track description'
        created:
          type: string
          format: date-time
          description: 'When the track was initially created'
        created_by_ref:
          type: string
          description: 'STIX ID of the user who created the track'
          example: 'identity--12345678-1234-1234-1234-123456789012'
        object_marking_refs:
          type: array
          items:
            type: string
          description: 'STIX marking definition references'
        members:
          type: array
          description: 'Released objects (promoted from staged during tagging)'
          items:
            $ref: '#/components/schemas/tier-entry'
        staged:
          type: array
          nullable: true
          description: 'Reviewed objects ready for next release (standard tracks only)'
          items:
            $ref: '#/components/schemas/staged-entry'
        candidates:
          type: array
          nullable: true
          description: 'Objects in workflow (standard tracks only)'
          items:
            $ref: '#/components/schemas/candidate-entry'
        quarantine:
          type: array
          nullable: true
          description: 'Conflicting objects needing resolution (virtual tracks only)'
          items:
            $ref: '#/components/schemas/tier-entry'
        composition:
          nullable: true
          description: 'Component track references (virtual tracks only)'
          $ref: '#/components/schemas/composition'
        composition_resolution:
          type: object
          nullable: true
          description: |
            Immutable component-resolution provenance for a materialized virtual
            draft. Null or absent means the virtual composition is configured
            but has not been materialized and therefore cannot be previewed or
            released. Duplicate counts include STIX IDs contributed by more than
            one component, while conflicts include only IDs with genuinely
            different revisions. Each surviving member is attributed to exactly
            one component in objects_contributed.
        scheduled_materialization:
          nullable: true
          description: |
            Immutable per-snapshot materialization metadata for virtual
            tracks. Clients may set it during virtual-track creation or
            composition update; the scheduler sets the same shape on drafts
            that it creates.
          $ref: '#/components/schemas/scheduled-materialization'
        config:
          $ref: '#/components/schemas/track-config'
        version_history:
          type: array
          description: 'History of tagged releases'
          items:
            $ref: '#/components/schemas/version-history-entry'

    graph-statistics:
      type: object
      readOnly: true
      description: 'Counts of exact revision pointers by role in a materialized snapshot graph'
      required:
        - primary_count
        - secondary_count
        - relationship_count
        - supporting_count
        - link_target_count
        - total_count
      properties:
        primary_count:
          type: integer
          minimum: 0
          description: 'Primary member objects selected for the snapshot'
        secondary_count:
          type: integer
          minimum: 0
          description: 'Source-attested historical non-member objects; zero for ordinary closed-member graphs'
        relationship_count:
          type: integer
          minimum: 0
          description: 'Relationships connecting objects in the resolved graph'
        supporting_count:
          type: integer
          minimum: 0
          description: 'Supporting identities and marking definitions required by cached objects'
        link_target_count:
          type: integer
          minimum: 0
          description: 'Objects pinned to resolve LinkById references deterministically'
        total_count:
          type: integer
          minimum: 0
          description: 'Total emitted graph dependencies, excluding the collection metadata entry'

    bundle-hashes:
      type: object
      readOnly: true
      description: |
        SHA-256 digests of the exact UTF-8, four-space-indented JSON files
        downloaded for a deterministic snapshot. The manifest ID binds the
        digests to the cached graph that produced them.
      required:
        - manifest_id
        - stix_2_0
        - stix_2_1
      properties:
        manifest_id:
          type: string
        stix_2_0:
          type: string
          pattern: '^[a-f0-9]{64}$'
        stix_2_1:
          type: string
          pattern: '^[a-f0-9]{64}$'

    snapshot-summary:
      type: object
      description: 'Lightweight metadata shared by standard and virtual snapshot summaries'
      required:
        - id
        - type
        - modified
        - version
        - name
        - members_count
      properties:
        id:
          type: string
          description: 'Release track ID'
        type:
          type: string
          enum:
            - standard
            - virtual
        modified:
          type: string
          format: date-time
        version:
          type: string
          nullable: true
          description: 'Tagged version, or null for an untagged draft'
        graph_manifest_id:
          type: string
          readOnly: true
          description: |
            Opaque identifier for the tagged snapshot's deterministic member
            graph. Omitted when the snapshot has not been materialized.
        bundle_hashes:
          $ref: '#/components/schemas/bundle-hashes'
        graph_statistics:
          $ref: '#/components/schemas/graph-statistics'
          description: |
            High-level statistics for the materialized graph. Omitted when the
            snapshot does not reference a graph manifest.
        snapshot_description:
          type: string
          maxLength: 4000
          description: |
            User-authored notes attached only to this snapshot and mapped to
            x-mitre-collection.description during bundle export. Notes cannot
            be changed while the snapshot has a deterministic graph cache.
        name:
          type: string
        description:
          type: string
        members_count:
          type: integer
          minimum: 0

    standard-snapshot-summary:
      allOf:
        - $ref: '#/components/schemas/snapshot-summary'
        - type: object
          description: 'Snapshot summary for a standard release track'
          required:
            - staged_count
            - candidates_count
          properties:
            type:
              type: string
              enum:
                - standard
            staged_count:
              type: integer
              minimum: 0
            candidates_count:
              type: integer
              minimum: 0

    virtual-snapshot-summary:
      allOf:
        - $ref: '#/components/schemas/snapshot-summary'
        - type: object
          description: 'Snapshot summary for a virtual release track'
          required:
            - quarantine_count
          properties:
            type:
              type: string
              enum:
                - virtual
            scheduled_materialization:
              nullable: true
              $ref: '#/components/schemas/scheduled-materialization'
            quarantine_count:
              type: integer
              minimum: 0

    tier-entry-base:
      type: object
      description: 'Shared fields for a release-track object reference'
      properties:
        object_ref:
          type: string
          description: 'STIX ID of the object'
          example: 'attack-pattern--12345678-1234-1234-1234-123456789012'
        attack_id:
          type: string
          description: 'ATT&CK ID, if found'
          example: 'T1234'
        name:
          type: string
          description: 'Object name, if found'
        description:
          type: string
          description: 'Object description, if found'
        modified_by_user:
          type: object
          description: 'User who last modified this object version, if found'
          properties:
            id:
              type: string
              description: 'User ID'
            username:
              type: string
              description: 'Username'
            displayName:
              type: string
              description: 'Display name'
            name:
              type: string
              description: 'Display name, or username if display name is missing'

    tier-entry:
      allOf:
        - $ref: '#/components/schemas/tier-entry-base'
        - type: object
          description: 'An immutable reference to a specific STIX object revision'
          properties:
            object_modified:
              type: string
              format: date-time
              description: 'Exact modified timestamp of this object revision'

    candidate-entry:
      allOf:
        - $ref: '#/components/schemas/tier-entry-base'
        - type: object
          properties:
            object_modified:
              description: 'An exact revision timestamp or the dynamic selector "latest"'
              oneOf:
                - type: string
                  format: date-time
                - type: string
                  enum:
                    - latest
            object_status:
              type: string
              enum:
                - modified-in-place
                - work-in-progress
                - awaiting-review
                - reviewed
              description: 'Workflow status (scoped to this track). modified-in-place is retained only for legacy data; persisted STIX revisions are now immutable.'
            object_added_at:
              type: string
              format: date-time
              description: 'When added to candidates'
            object_added_by:
              type: string
              description: 'User who added this candidate'

    staged-entry:
      allOf:
        - $ref: '#/components/schemas/tier-entry-base'
        - type: object
          properties:
            object_modified:
              description: 'An exact revision timestamp or the dynamic selector "latest"'
              oneOf:
                - type: string
                  format: date-time
                - type: string
                  enum:
                    - latest
            object_status:
              type: string
              enum:
                - modified-in-place
                - work-in-progress
                - awaiting-review
                - reviewed
              description: 'Workflow status (preserved from candidates). modified-in-place is retained only for legacy data; persisted STIX revisions are now immutable.'
            object_staged_at:
              type: string
              format: date-time
              description: 'When promoted to staged'
            object_staged_by:
              type: string
              description: 'User who staged this object'

    track-config:
      type: object
      description: 'Release track configuration'
      properties:
        auto_promote:
          type: boolean
          description: 'Whether to automatically promote candidates that meet the threshold'
          default: false
        candidacy_threshold:
          type: string
          enum:
            - work-in-progress
            - awaiting-review
            - reviewed
          description: 'Minimum workflow status required for auto-promotion to staged'
          default: 'reviewed'
        promotion_conflicts:
          type: object
          description: 'Conflict resolution policies for tier transitions'
          properties:
            into_candidates:
              type: string
              enum:
                - always_overwrite
                - always_reject
                - prefer_latest
                - abort
              description: 'How to handle conflicts when a manually added or demoted entry targets an object_ref already pinned in candidates at a different revision'
              default: 'prefer_latest'
            candidates_to_staged:
              type: string
              enum:
                - always_overwrite
                - always_reject
                - prefer_latest
                - abort
              description: 'How to handle conflicts when promoting candidates to staged'
              default: 'prefer_latest'
            staged_to_members:
              type: string
              enum:
                - always_overwrite
                - always_reject
                - prefer_latest
                - abort
              description: 'How to handle conflicts when tagging (promoting staged to members)'
              default: 'abort'

    composition:
      type: object
      description: 'Virtual track composition (references to component standard tracks)'
      additionalProperties: false
      required:
        - component_tracks
      properties:
        component_tracks:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/component-track'
        deduplication:
          type: object
          additionalProperties: false
          required:
            - strategy
          properties:
            strategy:
              type: string
              enum:
                - prioritize_latest_object
                - prioritize_latest_snapshot
                - prioritize_higher_priority
                - quarantine
              description: 'How to resolve duplicate objects across components'
              default: 'prioritize_latest_object'

    component-track:
      type: object
      description: |
        Reference to a component standard track. Selector fields are determined
        by resolution_strategy: latest_tagged rejects version and snapshot;
        specific_version requires only version; specific_snapshot requires only
        snapshot. Unknown properties are rejected.
      additionalProperties: false
      required:
        - track_id
        - resolution_strategy
        - priority
      properties:
        track_id:
          type: string
          description: 'The release track ID of the component'
          example: 'release-track--a1b2c3d4-e5f6-7890-abcd-ef1234567890'
        priority:
          type: integer
          minimum: 0
          description: 'Required unique component priority; lower numbers have higher priority'
        resolution_strategy:
          type: string
          enum:
            - latest_tagged
            - specific_version
            - specific_snapshot
          description: 'How to resolve which snapshot to use from this component'
          default: 'latest_tagged'
        version:
          type: string
          description: 'Specific version to pin to (when resolution_strategy is specific_version)'
        snapshot:
          type: string
          format: date-time
          description: 'Specific snapshot to pin to (when resolution_strategy is specific_snapshot)'
        filters:
          type: object
          description: 'Optional filters to apply to component members'
          additionalProperties: false
          properties:
            object_types:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: string
                enum:
                  - 'x-mitre-asset'
                  - 'campaign'
                  - 'x-mitre-collection'
                  - 'intrusion-set'
                  - 'course-of-action'
                  - 'tool'
                  - 'x-mitre-tactic'
                  - 'malware'
                  - 'x-mitre-matrix'
                  - 'relationship'
                  - 'marking-definition'
                  - 'identity'
                  - 'note'
                  - 'x-mitre-data-source'
                  - 'x-mitre-data-component'
                  - 'attack-pattern'
                  - 'x-mitre-analytic'
                  - 'x-mitre-detection-strategy'
              description: 'Only include members whose object_ref uses one of these canonical Workbench STIX type prefixes; omit the property to include all types'
            domains:
              type: array
              items:
                type: string
              description: 'Only include exact pinned object revisions whose x_mitre_domains intersects these ATT&CK domains. Primary matrices fall back to external_references.external_id. Accepts enterprise/mobile/ics and their -attack forms.'
      oneOf:
        - title: 'Latest tagged release'
          properties:
            resolution_strategy:
              enum:
                - latest_tagged
          not:
            anyOf:
              - required:
                  - version
              - required:
                  - snapshot
        - title: 'Specific release version'
          required:
            - version
          properties:
            resolution_strategy:
              enum:
                - specific_version
          not:
            required:
              - snapshot
        - title: 'Specific tagged snapshot'
          required:
            - snapshot
          properties:
            resolution_strategy:
              enum:
                - specific_snapshot
          not:
            required:
              - version

    version-history-entry:
      type: object
      description: 'Record of a tagged release'
      properties:
        version:
          type: string
          description: 'The semantic version number'
          example: '1.0'
        tagged_at:
          type: string
          format: date-time
          description: 'When this version was tagged'
        tagged_by:
          type: string
          description: 'User who tagged this version'
        snapshot_id:
          type: string
          format: date-time
          description: 'The snapshot modified timestamp that was tagged'
        summary:
          type: object
          description: 'Statistics about this release'
          properties:
            members_count:
              type: number
              description: 'Total objects in members tier after release'
            promoted_count:
              type: number
              description: 'Objects promoted from staged in this release'
            staged_count:
              type: number
              description: 'Objects remaining in staged after release'
            candidates_count:
              type: number
              description: 'Objects in candidates at time of release'
            quarantine_count:
              type: number
              description: 'Objects in quarantine at time of a virtual release'
        component_versions:
          type: object
          description: |
            Virtual releases only. Immutable provenance keyed by component
            release-track ID; each value is the tagged component version frozen
            in the released draft's composition_resolution. Standard release
            history entries omit this property.
          additionalProperties:
            type: string
            pattern: '^\d+\.\d+$'
          example:
            release-track--a1b2c3d4-e5f6-7890-abcd-ef1234567890: '5.2'

    release-track-registry:
      type: object
      description: 'Registry entry tracking metadata about a release track'
      properties:
        track_id:
          type: string
          description: 'The release track ID'
          example: 'release-track--a1b2c3d4-e5f6-7890-abcd-ef1234567890'
        type:
          type: string
          enum:
            - standard
            - virtual
          description: 'Track type'
        name:
          type: string
          pattern: '^[a-zA-Z0-9 &]+$'
          description: 'Track name containing alphanumeric characters, spaces, and ampersands'
        description:
          type: string
          description: 'Track description'
        latest_snapshot_modified:
          type: string
          format: date-time
          description: 'Timestamp of the most recent snapshot'
        latest_tagged_version:
          type: string
          nullable: true
          description: 'Most recent tagged version number'
          example: '2.1'
        snapshot_count:
          type: number
          description: 'Total number of snapshots for this track'
        tagged_release_count:
          type: number
          description: 'Number of tagged releases'
        tagged_releases:
          type: array
          description: 'Compact references to every tagged snapshot in this track'
          items:
            $ref: '#/components/schemas/tagged-release-reference'
        summary:
          type: object
          description: 'Counts of objects in each release track tier for the latest snapshot'
          properties:
            members_count:
              type: number
              description: 'Number of objects in the members tier'
            staged_count:
              type: number
              description: 'Number of objects in the staged tier'
            candidates_count:
              type: number
              description: 'Number of objects in the candidates tier'
        created_at:
          type: string
          format: date-time
          description: 'When the track was created'
        updated_at:
          type: string
          format: date-time
          description: 'When the track metadata was last updated'
        snapshot_schedule:
          nullable: true
          description: 'Snapshot creation schedule for virtual tracks'
          $ref: '#/components/schemas/snapshot-schedule'
        scheduled_materialization:
          nullable: true
          description: 'Materialization metadata from the latest virtual snapshot'
          $ref: '#/components/schemas/scheduled-materialization'

    tagged-release-reference:
      type: object
      description: 'Registry reference to a tagged snapshot'
      properties:
        snapshot_modified:
          type: string
          format: date-time
          description: 'The tagged snapshot modified timestamp'
        version:
          type: string
          description: 'The tagged MAJOR.MINOR version'
        tagged_at:
          type: string
          format: date-time
          description: 'When the snapshot was tagged'
        tagged_by:
          type: string
          description: 'User account that tagged the snapshot'

    release-by-object-entry:
      type: object
      description: 'One tagged release that directly contains the requested STIX object'
      properties:
        track_id:
          type: string
        track_type:
          type: string
          enum:
            - standard
            - virtual
        track_name:
          type: string
        version:
          type: string
        snapshot_modified:
          type: string
          format: date-time
        tagged_at:
          type: string
          format: date-time
        tagged_by:
          type: string
        object_modified:
          type: string
          format: date-time

    snapshot-schedule:
      description: |
        Virtual snapshot-creation schedule. Cron and explicit dates are
        interpreted in UTC and execute only when the global scheduler is enabled.
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - mode
          properties:
            mode:
              type: string
              enum:
                - manual
              description: 'Snapshots are created explicitly'
        - type: object
          additionalProperties: false
          required:
            - mode
            - cron
          properties:
            mode:
              type: string
              enum:
                - cron
            cron:
              type: string
              description: 'Five-field UTC cron expression'
              example: '0 0 1 1,7 *'
        - type: object
          additionalProperties: false
          required:
            - mode
            - dates
          properties:
            mode:
              type: string
              enum:
                - dates
            dates:
              type: array
              minItems: 1
              items:
                type: string
                format: date-time
              description: 'Explicit UTC dates for snapshot creation'

    scheduled-materialization:
      type: object
      additionalProperties: false
      description: |
        Immutable materialization occurrence attached to one virtual snapshot.
        It may be supplied by a client write or by the virtual-track scheduler.
      required:
        - schedule_mode
        - scheduled_for
      properties:
        schedule_mode:
          type: string
          enum:
            - cron
            - dates
        scheduled_for:
          type: string
          format: date-time
          description: 'UTC occurrence timestamp; also serves as the idempotency key'

    object-revision-reference:
      type: object
      required:
        - object_ref
        - object_modified
      properties:
        object_ref:
          type: string
          description: 'STIX object ID'
        object_modified:
          type: string
          format: date-time
          description: 'Exact STIX revision timestamp'

    object-revision-error:
      type: object
      required:
        - message
        - missing_references
      properties:
        message:
          type: string
          description: 'Whether request input or persisted primary content failed validation'
        missing_references:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/object-revision-reference'

    source-graph-reconstruction:
      type: object
      additionalProperties: false
      required:
        - source_attestation
        - entries
      properties:
        source_attestation:
          type: object
          additionalProperties: false
          required:
            - kind
            - bundle_sha256
            - collection_id
            - release
            - domain
          properties:
            kind:
              type: string
              enum:
                - source-bundle
            bundle_sha256:
              type: string
              pattern: '^[a-f0-9]{64}$'
            collection_id:
              type: string
            release:
              type: string
            domain:
              type: string
              enum:
                - enterprise-attack
                - ics-attack
                - mobile-attack
        entries:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/source-graph-entry'

    source-graph-entry:
      type: object
      additionalProperties: false
      required:
        - kind
        - object_ref
        - object_modified
      properties:
        kind:
          type: string
          enum:
            - root
            - relationship
            - secondary
            - supporting
            - link_target
        object_ref:
          type: string
        object_modified:
          type: string
          format: date-time
          nullable: true
        source:
          $ref: '#/components/schemas/object-revision-reference'
        target:
          $ref: '#/components/schemas/object-revision-reference'
        omitted_optional_defaults:
          type: array
          maxItems: 2
          uniqueItems: true
          description: >-
            Optional false-valued fields omitted by the attested source
            publication; valid only as deterministic serialization hints.
          items:
            type: string
            enum:
              - revoked
              - x_mitre_remote_support
        frozen_stix:
          type: object
          description: 'Allowed only for unversioned marking definitions'

    release-track-reconciliation-error:
      type: object
      required:
        - message
        - track_id
        - reconciliation_id
      properties:
        message:
          type: string
          enum:
            - 'Release-track membership protection could not be reconciled'
        details:
          type: string
          description: 'Operator guidance; the track mutation may already be persisted'
        track_id:
          type: string
          description: 'Release track whose object backrefs require repair'
        reconciliation_id:
          type: string
          format: uuid
          description: 'Durable reconciliation record to inspect or repair'

    release-track-audit-error:
      type: object
      required:
        - message
        - track_id
        - audit_event_id
      properties:
        message:
          type: string
          enum:
            - 'Release-track audit recording could not be finalized'
        details:
          type: string
          description: 'Operator guidance; the destructive operation may already be persisted'
        track_id:
          type: string
        audit_event_id:
          type: string
          format: uuid
