paths:
  # =============================================================================
  # Ephemeral bundles
  # =============================================================================
  /api/release-tracks/ephemeral/{domain}:
    get:
      summary: 'Generate an ephemeral bundle for a domain'
      operationId: 'release-tracks-ephemeral-get'
      description: |
        Generate a stateless bundle containing all objects from a given ATT&CK domain.
        This endpoint queries the database by domain without persisting a release track.
        It supplants the deprecated GET /api/stix-bundles endpoint.
      tags:
        - 'Release Tracks'
      parameters:
        - name: domain
          in: path
          required: true
          description: 'ATT&CK domain'
          schema:
            type: string
            enum:
              - enterprise
              - ics
              - mobile
            example: 'enterprise'
        - name: format
          in: query
          description: 'Output format. filesystemstore is not yet implemented.'
          schema:
            type: string
            enum:
              - bundle
              - workbench
              - filesystemstore
            default: bundle
        - name: stixVersion
          in: query
          description: |
            STIX version that the exported bundle should conform to (bundle format only).
          schema:
            type: string
            enum:
              - '2.0'
              - '2.1'
            default: '2.1'
        - name: includeToc
          in: query
          description: |
            Whether to include a table-of-contents object (of type `x-mitre-collection`)
            in the bundle (bundle format only).
          schema:
            type: boolean
            default: true
        - name: includeObjectsWithMissingAttackId
          in: query
          description: |
            Whether to include objects that should have an ATT&CK ID set but do not
            (bundle format only).
          schema:
            type: boolean
            default: false
        - name: includeDeprecated
          in: query
          description: |
            Whether to include objects that have the `x_mitre_deprecated` property set to true
            (bundle format only).
          schema:
            type: boolean
            default: false
        - name: includeRevoked
          in: query
          description: |
            Whether to include objects that have the `revoked` property set to true
            (bundle format only).
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 'Ephemeral bundle generated successfully'
        '501':
          description: 'Requested format is not yet implemented'

  # =============================================================================
  # Track management
  # =============================================================================
  /api/release-tracks:
    get:
      summary: 'List all release tracks'
      operationId: 'release-tracks-list'
      description: |
        Retrieve a paginated list of release track registry entries.
        Returns metadata about each track (not full snapshots).
      tags:
        - 'Release Tracks'
      parameters:
        - name: type
          in: query
          description: 'Filter by track type'
          schema:
            type: string
            enum:
              - standard
              - virtual
        - name: search
          in: query
          description: 'Search by name or description (case-insensitive)'
          schema:
            type: string
        - name: limit
          in: query
          description: 'Number of tracks to return (0 for all)'
          schema:
            type: number
            default: 0
        - name: offset
          in: query
          description: 'Number of tracks to skip'
          schema:
            type: number
            default: 0
      responses:
        '200':
          description: 'List of release tracks'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../components/release-tracks.yml#/components/schemas/release-track-registry'
                  pagination:
                    type: object
                    properties:
                      total:
                        type: number
                      limit:
                        type: number
                      offset:
                        type: number

  /api/release-tracks/objects/{objectRef}/releases:
    get:
      summary: 'List tagged releases containing a STIX object'
      operationId: 'release-tracks-releases-by-object'
      description: |
        Return every tagged release-track snapshot whose members tier directly
        contains the supplied STIX ID. The result spans all object revisions.
        Drafts, non-member tiers, and secondary bundle-export objects are excluded.
      tags:
        - 'Release Tracks'
      parameters:
        - name: objectRef
          in: path
          required: true
          description: 'STIX ID to locate across tagged releases'
          schema:
            type: string
        - name: type
          in: query
          description: 'Restrict results to one release-track type'
          schema:
            type: string
            enum:
              - standard
              - virtual
        - name: order
          in: query
          description: 'Snapshot chronology order'
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: limit
          in: query
          description: 'Maximum number of results to return'
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          description: 'Number of matching releases to skip'
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: 'Tagged releases containing the object'
          content:
            application/json:
              schema:
                type: object
                properties:
                  object_ref:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '../components/release-tracks.yml#/components/schemas/release-by-object-entry'
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      limit:
                        type: integer
                      offset:
                        type: integer
        '400':
          description: 'Malformed STIX ID or invalid query parameter'

  /api/release-tracks/new:
    post:
      summary: 'Create a new release track'
      operationId: 'release-tracks-create'
      description: |
        Create a new standard or virtual release track with an initial empty draft snapshot.
        Request body is validated via Zod (not OpenAPI). See controller for schema.
      tags:
        - 'Release Tracks'
      # Request body validation moved to Zod in controller
      responses:
        '201':
          description: 'Release track created successfully'
          content:
            application/json:
              schema:
                $ref: '../components/release-tracks.yml#/components/schemas/release-track-snapshot'
        '400':
          description: 'Invalid request parameters'

  /api/release-tracks/new-from-bundle:
    post:
      summary: 'Create a release track from a STIX bundle'
      operationId: 'release-tracks-create-from-bundle'
      description: |
        Parse a STIX bundle and create a new release track with member objects extracted from x_mitre_contents.
        Request body validation moved to Zod in controller.
      tags:
        - 'Release Tracks'
      responses:
        '201':
          description: 'Release track created from bundle'
        '501':
          description: 'Not yet implemented'

  /api/release-tracks/import:
    post:
      summary: 'Import a release track'
      operationId: 'release-tracks-import'
      description: |
        Import a release track with all snapshots and version history.
        Request body validation moved to Zod in controller.
      tags:
        - 'Release Tracks'
      responses:
        '201':
          description: 'Release track imported successfully'
        '501':
          description: 'Not yet implemented'

  # =============================================================================
  # Track deletion
  # =============================================================================
  /api/release-tracks/{id}:
    delete:
      summary: 'Delete a release track'
      operationId: 'release-tracks-delete'
      description: |
        Delete an entire release track including all snapshots and version history.
        This operation cannot be undone.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          description: 'Release track ID'
          schema:
            type: string
      responses:
        '204':
          description: 'Release track deleted successfully'
        '404':
          description: 'Release track not found'

  # =============================================================================
  # Latest snapshot operations
  # =============================================================================
  /api/release-tracks/{id}/meta:
    post:
      summary: 'Update metadata on the latest snapshot'
      operationId: 'release-tracks-update-meta-latest'
      description: |
        Update name, description, or object_marking_refs on the latest snapshot.
        Creates a new snapshot clone with updated metadata.
        Request body validated via Zod in controller.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Metadata updated successfully'
          content:
            application/json:
              schema:
                $ref: '../components/release-tracks.yml#/components/schemas/release-track-snapshot'

  /api/release-tracks/{id}/contents:
    post:
      summary: 'Update member contents on the latest snapshot'
      operationId: 'release-tracks-update-contents-latest'
      description: |
        Replace the members tier with new contents (x_mitre_contents format).
        Exact revisions already present in another tier are retained only in members;
        different revisions of the same object remain valid across tiers.
        Creates a new snapshot clone.
        Request body validated via Zod in controller.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Contents updated successfully'

  /api/release-tracks/{id}/clone:
    post:
      summary: 'Clone the latest snapshot into a new release track'
      operationId: 'release-tracks-clone-latest'
      description: |
        Create a new release track by cloning the latest snapshot.
        Request body validated via Zod in controller.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: 'Release track cloned successfully'

  /api/release-tracks/{id}/bump:
    post:
      summary: 'Tag the latest snapshot (create a release)'
      operationId: 'release-tracks-bump-latest'
      description: |
        Tag the latest snapshot with a version number.
        For standard tracks: promotes staged → members.
        Exact staged/member duplicates are idempotent and normalized rather than treated as conflicts.
        For virtual tracks: N/A (already resolved).
        Request body validated via Zod in controller: { type: 'major'|'minor', version?: string, dry_run?: boolean }
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Snapshot tagged successfully'
        '409':
          description: 'Snapshot already tagged or conflict during promotion'
        '501':
          description: 'Not yet implemented'

  /api/release-tracks/{id}/bump/preview:
    get:
      summary: 'Preview the next release'
      operationId: 'release-tracks-bump-preview'
      description: |
        Compute what the next tagged release will contain without persisting changes.
        Shows which objects will be promoted from staged → members.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          description: 'Output format. filesystemstore is not yet implemented.'
          schema:
            type: string
            enum:
              - bundle
              - workbench
              - filesystemstore
            default: workbench
      responses:
        '200':
          description: 'Release preview generated'
        '501':
          description: 'Requested format is not yet implemented'

  # =============================================================================
  # Candidate management
  # =============================================================================
  /api/release-tracks/{id}/candidates:
    get:
      summary: 'List candidates in the latest snapshot'
      operationId: 'release-tracks-candidates-list'
      description: |
        Retrieve the candidates tier from the latest snapshot.
        Optionally filter by workflow status.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          description: 'Filter by workflow status'
          schema:
            type: string
            enum:
              - modified-in-place
              - work-in-progress
              - awaiting-review
              - reviewed
      responses:
        '200':
          description: 'Candidates retrieved successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates:
                    type: array
                    items:
                      $ref: '../components/release-tracks.yml#/components/schemas/candidate-entry'

    post:
      summary: 'Add objects as candidates'
      operationId: 'release-tracks-candidates-add'
      description: |
        Add one or more objects to the candidates tier.
        If modified is omitted or 'latest', resolves to the latest version of the object.
        If that exact revision is already pinned in any tier, the add is idempotently skipped.
        Different revisions of the same object may occupy different tiers.
        If auto_promote is enabled and candidates meet the threshold, they are auto-promoted to staged.
        Request body validated via Zod: { object_refs: Array<string | {id, modified}> }
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Candidates added successfully'

  /api/release-tracks/{id}/candidates/review:
    post:
      summary: 'Bulk transition candidate workflow status'
      operationId: 'release-tracks-candidates-review'
      description: |
        Transition candidates from one workflow status to another (forward-only).
        If auto_promote is enabled and candidates meet the threshold after transition, they are auto-promoted to staged.
        Tier changes retain an exact revision in only one tier and repair legacy cross-tier duplicates.
        `from` also accepts the server-assigned `modified-in-place` status; `to` accepts only the
        user-settable statuses (work-in-progress, awaiting-review, reviewed).
        Request body validated via Zod: { from, to, object_refs? }
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Candidates reviewed successfully'

  /api/release-tracks/{id}/candidates/promote:
    post:
      summary: 'Manually promote candidates to staged'
      operationId: 'release-tracks-candidates-promote'
      description: |
        Manually promote specific candidates to the staged tier, bypassing auto-promotion logic.
        Applies conflict resolution policy only to different revisions of the same object.
        Exact revisions are retained in one tier, with members taking precedence.
        Request body validated via Zod: { object_refs: string[] }
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Candidates promoted successfully'

  /api/release-tracks/{id}/candidates/{objectRef}:
    delete:
      summary: 'Remove a candidate'
      operationId: 'release-tracks-candidates-remove'
      description: |
        Remove all entries for a given object_ref from the candidates tier.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: objectRef
          in: path
          required: true
          description: 'STIX ID of the object to remove'
          schema:
            type: string
      responses:
        '200':
          description: 'Candidate removed successfully'
        '404':
          description: 'Candidate not found'

  /api/release-tracks/{id}/candidates/{objectRef}/update-version:
    post:
      summary: 'Update the version pin of a candidate'
      operationId: 'release-tracks-candidates-update-version'
      description: |
        Change which version of an object is being tracked in the candidates tier.
        If the new pin exactly matches another tier, the authoritative existing tier is retained.
        Request body validated via Zod: { old_modified, new_modified }
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: objectRef
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Candidate version pin updated successfully'

  # =============================================================================
  # Staged objects
  # =============================================================================
  /api/release-tracks/{id}/staged:
    get:
      summary: 'List staged objects in the latest snapshot'
      operationId: 'release-tracks-staged-list'
      description: |
        Retrieve the staged tier from the latest snapshot.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Staged objects retrieved successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  staged:
                    type: array
                    items:
                      $ref: '../components/release-tracks.yml#/components/schemas/staged-entry'

  /api/release-tracks/{id}/staged/demote:
    post:
      summary: 'Demote staged objects back to candidates'
      operationId: 'release-tracks-staged-demote'
      description: |
        Move objects from staged tier back to candidates tier.
        Applies into_candidates conflicts only to different revisions; exact revisions remain in one tier.
        Request body validated via Zod: { object_refs: Array<{id, modified}> }
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Staged objects demoted successfully'

  # =============================================================================
  # Configuration
  # =============================================================================
  /api/release-tracks/{id}/config:
    get:
      summary: 'Get release track configuration'
      operationId: 'release-tracks-config-get'
      description: |
        Retrieve the config sub-document from the latest snapshot.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Configuration retrieved successfully'
          content:
            application/json:
              schema:
                $ref: '../components/release-tracks.yml#/components/schemas/track-config'

    put:
      summary: 'Update release track configuration'
      operationId: 'release-tracks-config-update'
      description: |
        Merge configuration changes into the latest snapshot (creates new snapshot clone).
        Request body validated via Zod in controller.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Configuration updated successfully'

  # =============================================================================
  # Object version history
  # =============================================================================
  /api/release-tracks/{id}/objects/{objectRef}/versions:
    get:
      summary: 'List all versions of an object across tiers'
      operationId: 'release-tracks-object-versions'
      description: |
        Find all occurrences of a given object_ref across members, staged, and candidates tiers.
        Shows which versions are tracked in which tiers.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: objectRef
          in: path
          required: true
          description: 'STIX ID of the object'
          schema:
            type: string
      responses:
        '200':
          description: 'Object versions retrieved successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions:
                    type: array
                    items:
                      type: object
                      properties:
                        tier:
                          type: string
                          enum:
                            - members
                            - staged
                            - candidates
                        object_ref:
                          type: string
                        object_modified:
                          type: string
                          format: date-time
                        object_status:
                          type: string
                          nullable: true

  # =============================================================================
  # Virtual track operations
  # =============================================================================
  /api/release-tracks/{id}/composition:
    put:
      summary: 'Update virtual track composition'
      operationId: 'release-tracks-composition-update'
      description: |
        Update which component tracks a virtual track aggregates.
        Request body validated via Zod in controller.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Composition updated successfully'
        '501':
          description: 'Not yet implemented'

  /api/release-tracks/{id}/snapshots/create:
    post:
      summary: 'Create a virtual track snapshot'
      operationId: 'release-tracks-virtual-snapshot-create'
      description: |
        Resolve component tracks and create a new virtual snapshot.
        Request body validated via Zod in controller.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: 'Virtual snapshot created successfully'
        '501':
          description: 'Not yet implemented'

  /api/release-tracks/{id}/snapshots/preview:
    get:
      summary: 'Preview a virtual track snapshot'
      operationId: 'release-tracks-virtual-snapshot-preview'
      description: |
        Compute what a virtual snapshot would contain without persisting it.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Virtual snapshot preview generated'
        '501':
          description: 'Not yet implemented'

  # =============================================================================
  # Snapshot-specific operations
  # =============================================================================
  /api/release-tracks/{id}/snapshots:
    get:
      summary: 'List snapshots for a release track'
      operationId: 'release-tracks-snapshots-list'
      description: |
        Return lightweight summaries of every snapshot in the release track,
        ordered by modified timestamp from newest to oldest. Standard snapshot
        summaries contain members, staged, and candidates counts. Virtual
        snapshot summaries contain members and quarantine counts.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          description: 'Release track ID'
          schema:
            type: string
        - name: tagged
          in: query
          description: |
            Filter by tagged state. true returns snapshots with a version;
            false returns untagged drafts. Omit to return both.
          schema:
            type: boolean
        - name: limit
          in: query
          description: 'Number of snapshot summaries to return'
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          description: 'Number of matching snapshot summaries to skip'
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: 'Snapshot summaries retrieved successfully'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      oneOf:
                        - $ref: '../components/release-tracks.yml#/components/schemas/standard-snapshot-summary'
                        - $ref: '../components/release-tracks.yml#/components/schemas/virtual-snapshot-summary'
                  pagination:
                    type: object
                    required:
                      - total
                      - limit
                      - offset
                    properties:
                      total:
                        type: integer
                      limit:
                        type: integer
                      offset:
                        type: integer
        '400':
          description: 'Invalid filter or pagination parameter'
        '404':
          description: 'Release track not found'

  /api/release-tracks/{id}/snapshots/latest:
    get:
      summary: 'Get the latest snapshot of a release track'
      operationId: 'release-tracks-snapshot-get-latest'
      description: |
        Return the most recent full snapshot for a release track.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          description: 'Release track ID'
          schema:
            type: string
        - name: include
          in: query
          description: |
            Format-sensitive tier selector. For workbench responses, selects
            members, staged, candidates, quarantine, or all. For bundle
            responses, selects staged and/or candidates in addition to members.
          allowReserved: true
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
        - name: format
          in: query
          description: 'Output format. filesystemstore is not yet implemented.'
          schema:
            type: string
            enum:
              - bundle
              - workbench
              - filesystemstore
            default: workbench
        - name: state
          in: query
          description: 'Workflow-status filter for bundle staged/candidate tiers'
          allowReserved: true
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
        - name: stixVersion
          in: query
          description: 'STIX version for bundle responses'
          schema:
            type: string
            enum:
              - '2.0'
              - '2.1'
            default: '2.1'
        - name: includeToc
          in: query
          description: 'Include the x-mitre-collection TOC in bundle responses'
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: 'Latest snapshot retrieved successfully'
          content:
            application/json:
              schema:
                $ref: '../components/release-tracks.yml#/components/schemas/release-track-snapshot'
        '404':
          description: 'Release track not found'
        '501':
          description: 'Requested format is not yet implemented'

  /api/release-tracks/{id}/snapshots/{modified}:
    get:
      summary: 'Get a specific snapshot by modified timestamp'
      operationId: 'release-tracks-snapshot-get'
      description: |
        Retrieve a historical snapshot identified by its modified timestamp.
        Use format=bundle to export the snapshot as a STIX bundle.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: modified
          in: path
          required: true
          description: 'ISO 8601 timestamp'
          schema:
            type: string
        - name: include
          in: query
          description: |
            Format-sensitive tier selector.
            For format=workbench (default): a single value controlling which tier arrays
            are returned — members | staged | candidates | quarantine | all (default: all).
            For format=bundle: a list of additional tiers (staged and/or candidates,
            comma-separated or repeated) to include alongside members. If omitted, only
            members are included in the bundle.
          allowReserved: true
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
        - name: format
          in: query
          description: 'Output format. filesystemstore is not yet implemented.'
          schema:
            type: string
            enum:
              - bundle
              - filesystemstore
              - workbench
            default: workbench
        - name: state
          in: query
          description: |
            Workflow-status filter for the staged/candidate tiers selected via include
            (bundle format only). Accepts modified-in-place, work-in-progress and/or
            awaiting-review (comma-separated or repeated). Entries marked reviewed are
            always included, irrespective of this parameter. Members are unaffected.
          allowReserved: true
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
        - name: stixVersion
          in: query
          description: |
            STIX version that the exported bundle should conform to (bundle format only).
          schema:
            type: string
            enum:
              - '2.0'
              - '2.1'
            default: '2.1'
        - name: includeToc
          in: query
          description: |
            Whether to include a table-of-contents object (of type `x-mitre-collection`)
            derived from the release-track metadata (bundle format only).
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: 'Snapshot retrieved successfully'
        '404':
          description: 'Snapshot not found'
        '501':
          description: 'Requested format is not yet implemented'

    delete:
      summary: 'Delete a specific snapshot'
      operationId: 'release-tracks-snapshot-delete'
      description: |
        Delete a snapshot by its modified timestamp.
        Cannot delete tagged snapshots.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: modified
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'Snapshot deleted successfully'
        '409':
          description: 'Cannot delete tagged snapshot'
        '404':
          description: 'Snapshot not found'

  /api/release-tracks/{id}/snapshots/{modified}/meta:
    post:
      summary: 'Update metadata on a specific snapshot'
      operationId: 'release-tracks-update-meta-by-modified'
      description: |
        Update metadata on a historical snapshot.
        Request body validated via Zod in controller.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: modified
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Metadata updated successfully'

  /api/release-tracks/{id}/snapshots/{modified}/contents:
    post:
      summary: 'Update contents on a specific snapshot'
      operationId: 'release-tracks-update-contents-by-modified'
      description: |
        Update member contents on a historical snapshot.
        Exact revisions already present in another tier are retained only in members;
        different revisions of the same object remain valid across tiers.
        Request body validated via Zod in controller.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: modified
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Contents updated successfully'

  /api/release-tracks/{id}/snapshots/{modified}/clone:
    post:
      summary: 'Clone a specific snapshot into a new release track'
      operationId: 'release-tracks-clone-by-modified'
      description: |
        Create a new release track by cloning a historical snapshot.
        Request body validated via Zod in controller.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: modified
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: 'Release track cloned successfully'

  /api/release-tracks/{id}/snapshots/{modified}/bump:
    post:
      summary: 'Tag a specific snapshot'
      operationId: 'release-tracks-bump-by-modified'
      description: |
        Tag a historical snapshot with a version number.
        Exact staged/member duplicates are idempotent and normalized rather than treated as conflicts.
        Request body validated via Zod in controller.
      tags:
        - 'Release Tracks'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: modified
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Snapshot tagged successfully'
        '501':
          description: 'Not yet implemented'
